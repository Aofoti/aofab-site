<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <meta name="description" content="AoFab" />
  <title>AoFab</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <style>
    :root {
      --bg: #05070d;
      --cyan: #5eead4;
      --ice: #67e8f9;
      --signal: #22d3ee;
      --deep: #0e7490;
      --text: rgba(226, 232, 240, 0.88);
      --muted: rgba(94, 234, 212, 0.55);
      --panel: rgba(5, 7, 13, 0.72);
      --line: rgba(94, 234, 212, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }
    #field {
      position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
      background: var(--bg); cursor: grab; touch-action: none;
    }
    #field:active { cursor: grabbing; }
    .grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background-image:
        linear-gradient(rgba(94, 234, 212, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 234, 212, 0.035) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse at center, black 18%, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 18%, transparent 72%);
      opacity: 0.55;
    }
    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 28%, rgba(5, 7, 13, 0.82) 100%),
        linear-gradient(180deg, rgba(5, 7, 13, 0.55) 0%, transparent 18%, transparent 82%, rgba(5, 7, 13, 0.7) 100%);
    }
    .scan {
      position: fixed; inset: 0; pointer-events: none; z-index: 3;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(5, 7, 13, 0.08) 3px
      );
      opacity: 0.35;
      mix-blend-mode: multiply;
    }
    .hero {
      position: fixed; inset: 0; z-index: 4;
      display: grid; place-items: center;
      padding: clamp(1.25rem, 4vw, 3rem);
      pointer-events: none;
    }
    .mark {
      text-align: center;
      user-select: none;
      position: relative;
      display: grid;
      place-items: center;
    }
    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      left: 50%;
      width: min(48vw, 13rem);
      height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(94, 234, 212, 0.45), transparent);
    }
    .mark::before { top: -1.5rem; }
    .mark::after { bottom: -1.5rem; }
    .mark img,
    .mark svg {
      display: block;
      width: clamp(5.5rem, 18vw, 9.5rem);
      height: auto;
      filter:
        drop-shadow(0 0 18px rgba(34, 211, 238, 0.18))
        drop-shadow(0 0 42px rgba(94, 234, 212, 0.1));
    }
    /* Glittering gold ao mark */
    .ao-gold {
      position: relative;
      display: block;
      line-height: 0;
      filter:
        drop-shadow(0 0 10px rgba(245, 200, 96, 0.22))
        drop-shadow(0 0 32px rgba(201, 150, 46, 0.12));
    }
    .mark .ao-gold img.ao-base { filter: none; }
    .ao-fill,
    .ao-glitter {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: none;
      pointer-events: none;
    }
    @supports ((mask-image: url("x.png")) or (-webkit-mask-image: url("x.png"))) {
      .ao-fill,
      .ao-glitter {
        display: block;
        -webkit-mask-image: url("ao-mark.png");
        mask-image: url("ao-mark.png");
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
      }
      .ao-fill {
        background:
          linear-gradient(105deg,
            rgba(255, 246, 214, 0) 38%,
            rgba(255, 246, 214, 0.55) 47%,
            rgba(255, 255, 245, 0.85) 50%,
            rgba(255, 246, 214, 0.55) 53%,
            rgba(255, 246, 214, 0) 62%) 120% 0 / 260% 100% no-repeat,
          linear-gradient(170deg,
            #7a5a14 0%, #b8862b 18%, #f5d77a 38%, #fff3c4 47%,
            #e2b85a 56%, #c9962e 72%, #8a6418 100%);
        animation: ao-sheen 6s ease-in-out infinite;
      }
    }
    @keyframes ao-sheen {
      0% { background-position: 120% 0, 0 0; }
      55%, 100% { background-position: -20% 0, 0 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ao-fill { animation: none; background-position: 120% 0, 0 0; }
      .ao-glitter { display: none !important; }
    }
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
    .hud {
      position: fixed;
      left: max(0.75rem, env(safe-area-inset-left));
      bottom: max(0.75rem, env(safe-area-inset-bottom));
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.5rem 0.75rem 0.65rem;
      min-width: min(15.5rem, calc(100vw - 1.5rem));
      max-height: min(70vh, calc(100vh - 1.5rem - env(safe-area-inset-bottom, 0px)));
      overflow: hidden;
      overscroll-behavior: contain;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--cyan);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      user-select: none;
      pointer-events: auto;
      transition: min-width 0.18s ease, padding 0.18s ease;
    }
    .hud.collapsed {
      min-width: 0;
      width: auto;
      padding: 0.4rem 0.5rem;
      gap: 0;
    }
    .hud-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      min-height: 1.35rem;
      flex: 0 0 auto;
    }
    .hud.collapsed .hud-head {
      justify-content: center;
    }
    .hud-title {
      opacity: 0.85;
      text-transform: uppercase;
      font-weight: 500;
    }
    .hud.collapsed .hud-title {
      display: none;
    }
    .hud-toggle {
      flex: 0 0 auto;
      width: 1.7rem;
      height: 1.7rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(94, 234, 212, 0.08);
      color: var(--ice);
      font: inherit;
      cursor: pointer;
      display: grid;
      place-items: center;
      line-height: 1;
      padding: 0;
    }
    .hud-toggle:hover {
      background: rgba(94, 234, 212, 0.16);
    }
    .hud-toggle svg {
      width: 0.85rem;
      height: 0.85rem;
      display: block;
      transition: transform 0.18s ease;
    }
    .hud.collapsed .hud-toggle svg {
      transform: rotate(180deg);
    }
    .hud-body {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      overflow-y: auto;
      overscroll-behavior: contain;
      max-height: calc(min(70vh, calc(100vh - 1.5rem - env(safe-area-inset-bottom, 0px))) - 2.4rem);
      scrollbar-width: thin;
      scrollbar-color: rgba(94, 234, 212, 0.35) transparent;
    }
    .hud.collapsed .hud-body {
      display: none;
    }
    .hud .btn-reset {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(94, 234, 212, 0.08);
      color: var(--ice);
      font: inherit;
      letter-spacing: inherit;
      padding: 0.28rem 0.45rem;
      cursor: pointer;
      text-transform: uppercase;
    }
    .hud .btn-reset:hover {
      background: rgba(94, 234, 212, 0.16);
    }
    .hud .btn-reset:active {
      background: rgba(94, 234, 212, 0.22);
    }
    .hud-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 1.35rem;
    }
    .hud label {
      flex: 0 0 4.2rem;
      opacity: 0.85;
      text-transform: uppercase;
      font-weight: 500;
    }
    .hud input[type="range"] {
      flex: 1;
      accent-color: var(--ice);
      height: 0.35rem;
      cursor: pointer;
    }
    .hud .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      flex: 1;
    }
    .hud .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      letter-spacing: inherit;
      padding: 0.28rem 0.35rem;
      cursor: pointer;
      text-transform: uppercase;
    }
    .hud .seg button.active {
      background: rgba(94, 234, 212, 0.14);
      color: var(--ice);
    }
    .hud .toggle {
      appearance: none;
      width: 2.1rem;
      height: 1.15rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(14, 116, 144, 0.25);
      position: relative;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .hud .toggle::after {
      content: "";
      position: absolute;
      top: 1px; left: 2px;
      width: 0.85rem; height: 0.85rem;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .hud .toggle.on {
      background: rgba(94, 234, 212, 0.22);
    }
    .hud .toggle.on::after {
      transform: translateX(0.85rem);
      background: var(--ice);
    }

    .hud-section {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .hud-section + .hud-section {
      margin-top: 0.15rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(94, 234, 212, 0.14);
    }
    .hud-section-label {
      opacity: 0.55;
      text-transform: uppercase;
      font-weight: 500;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      line-height: 1;
      padding: 0 0 0.05rem;
      user-select: none;
    }
    .hud .swatch {
      flex: 0 0 auto;
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: hsl(185, 72%, 55%);
      box-shadow: 0 0 10px rgba(94, 234, 212, 0.25);
    }

    .site-copy {
      position: fixed;
      left: 50%;
      bottom: max(0.4rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
      margin: 0;
      padding: 0 0.75rem;
      max-width: min(92vw, 28rem);
      text-align: center;
      font-size: 0.58rem;
      letter-spacing: 0.05em;
      line-height: 1.3;
      color: rgba(148, 163, 184, 0.32);
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 480px) {
      .site-copy {
        font-size: 0.52rem;
        letter-spacing: 0.03em;
        left: auto;
        right: max(0.55rem, env(safe-area-inset-right));
        transform: none;
        text-align: right;
        max-width: min(58vw, 14rem);
        white-space: normal;
      }
    }

    @media (max-width: 480px) {
      .hud {
        font-size: 0.68rem;
        min-width: min(13.5rem, calc(100vw - 1.2rem));
        max-height: min(62vh, calc(100vh - 1.2rem - env(safe-area-inset-bottom, 0px)));
      }
      .hud label { flex-basis: 3.6rem; }
    }

    /* Contact */
    .contact-btn {
      position: fixed;
      top: max(0.75rem, env(safe-area-inset-top));
      right: max(0.75rem, env(safe-area-inset-right));
      z-index: 7;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.38rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--cyan);
      font: inherit;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .contact-btn:hover, .contact-btn:focus-visible {
      background: rgba(94, 234, 212, 0.12);
      border-color: rgba(94, 234, 212, 0.45);
      color: var(--ice);
      outline: none;
    }
    .contact-btn svg { width: 0.85rem; height: 0.85rem; display: block; }
    .contact-overlay {
      position: fixed; inset: 0; z-index: 20;
      display: grid; place-items: center;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: rgba(2, 4, 8, 0.55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      touch-action: auto;
    }
    .contact-overlay[hidden] { display: none; }
    .contact-panel {
      position: relative;
      width: min(24rem, 100%);
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
      padding: 1rem 1.1rem 1.1rem;
      background: rgba(5, 7, 13, 0.82);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 0 0 1px rgba(94, 234, 212, 0.05), 0 18px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(34, 211, 238, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
    }
    .contact-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.85rem;
    }
    .contact-title {
      color: var(--cyan);
      font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    .contact-close {
      width: 1.7rem; height: 1.7rem;
      display: grid; place-items: center; padding: 0;
      border: 1px solid var(--line); border-radius: 6px;
      background: rgba(94, 234, 212, 0.08); color: var(--ice);
      cursor: pointer; font: inherit; line-height: 1;
    }
    .contact-close:hover, .contact-close:focus-visible { background: rgba(94, 234, 212, 0.18); outline: none; }
    .contact-close svg { width: 0.75rem; height: 0.75rem; display: block; }
    .contact-form { display: flex; flex-direction: column; gap: 0.7rem; }
    .contact-field { display: flex; flex-direction: column; gap: 0.3rem; }
    .contact-field label {
      color: var(--muted);
      font-size: 0.62rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .contact-field label .req { color: var(--ice); opacity: 0.8; }
    .contact-field input, .contact-field textarea {
      width: 100%;
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(14, 116, 144, 0.08);
      color: var(--text);
      font: inherit; font-size: 0.82rem; letter-spacing: 0.01em;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      user-select: text; -webkit-user-select: text;
    }
    .contact-field textarea { min-height: 6.5rem; resize: vertical; line-height: 1.45; }
    .contact-field input::placeholder, .contact-field textarea::placeholder { color: rgba(148, 163, 184, 0.4); }
    .contact-field input:focus, .contact-field textarea:focus {
      border-color: rgba(103, 232, 249, 0.6);
      background: rgba(14, 116, 144, 0.14);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12);
    }
    .contact-hp { position: absolute !important; left: -10000px !important; width: 1px; height: 1px; overflow: hidden; }
    .contact-actions { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-top: 0.15rem; }
    .contact-status { font-size: 0.72rem; line-height: 1.35; color: var(--muted); min-height: 1em; flex: 1; }
    .contact-status.ok { color: var(--ice); }
    .contact-status.err { color: #fda4af; }
    .contact-submit {
      flex: 0 0 auto;
      padding: 0.45rem 0.95rem;
      border: 1px solid rgba(94, 234, 212, 0.4);
      border-radius: 7px;
      background: rgba(94, 234, 212, 0.12);
      color: var(--ice);
      font: inherit; font-size: 0.68rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer;
    }
    .contact-submit:hover, .contact-submit:focus-visible { background: rgba(94, 234, 212, 0.22); outline: none; }
    .contact-submit[disabled] { opacity: 0.5; cursor: progress; }
    .contact-done { display: none; padding: 1.2rem 0 0.4rem; text-align: center; color: var(--ice); font-size: 0.85rem; letter-spacing: 0.04em; }
    .contact-panel.sent .contact-form { display: none; }
    .contact-panel.sent .contact-done { display: block; }
    /* Quick links */
    .links-btn {
      left: max(0.75rem, env(safe-area-inset-left));
      right: auto;
    }
    .links-btn {
      padding: 0.38rem;
      opacity: 0.38;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.2s ease;
    }
    .links-btn:hover, .links-btn:focus-visible, .links-btn[aria-expanded="true"] { opacity: 1; }
    .links-btn[aria-expanded="true"] {
      background: rgba(94, 234, 212, 0.12);
      border-color: rgba(94, 234, 212, 0.45);
      color: var(--ice);
    }
    .links-menu {
      position: fixed;
      top: calc(max(0.75rem, env(safe-area-inset-top)) + 2.15rem);
      left: max(0.75rem, env(safe-area-inset-left));
      z-index: 8;
      min-width: 13.5rem;
      max-width: calc(100vw - 1.5rem - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      padding: 0.35rem;
      background: rgba(5, 7, 13, 0.82);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 0 0 1px rgba(94, 234, 212, 0.05), 0 14px 40px rgba(0, 0, 0, 0.55), 0 0 32px rgba(34, 211, 238, 0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      font-size: 0.75rem;
      touch-action: auto;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px) scale(0.98);
      transform-origin: top left;
      transition: opacity 0.16s ease, transform 0.18s ease, visibility 0s linear 0.18s;
    }
    .links-menu.open {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity 0.16s ease, transform 0.18s ease, visibility 0s;
    }
    .links-head {
      padding: 0.35rem 0.55rem 0.4rem;
      color: var(--muted);
      font-size: 0.58rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    .links-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.55rem;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--text);
      text-decoration: none;
      outline: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .links-item:hover, .links-item:focus-visible, .links-item:focus {
      background: rgba(94, 234, 212, 0.1);
      border-color: rgba(94, 234, 212, 0.3);
    }
    .links-text { display: flex; flex-direction: column; gap: 0.12rem; min-width: 0; flex: 1; }
    .links-label { color: var(--ice); font-weight: 500; letter-spacing: 0.03em; }
    .links-note {
      color: var(--muted); font-size: 0.64rem; letter-spacing: 0.02em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .links-ext { width: 0.75rem; height: 0.75rem; flex: 0 0 auto; color: var(--cyan); opacity: 0.6; }
    .links-item:hover .links-ext, .links-item:focus .links-ext { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .links-menu, .links-menu.open, .links-btn { transition: none; }
      .links-menu { transform: none; }
    }
    @media (max-width: 480px) {
      .contact-btn { padding: 0.34rem 0.55rem; font-size: 0.62rem; }
      .links-btn { padding: 0.34rem; }
      .links-menu { top: calc(max(0.75rem, env(safe-area-inset-top)) + 2rem); }
      .contact-field input, .contact-field textarea { font-size: 16px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="grid" aria-hidden="true"></div>
  <div class="vignette"></div>
  <div class="scan" aria-hidden="true"></div>
  <main class="hero">
    <div class="mark">
      <h1 class="visually-hidden">AoFab</h1>
      <div class="ao-gold">
        <img class="ao-base" src="ao-mark-gold.png" width="1024" height="1024" alt="AoFab" />
        <span class="ao-fill" aria-hidden="true"></span>
        <canvas class="ao-glitter" aria-hidden="true"></canvas>
      </div>
    </div>
  </main>
  <aside class="hud" id="hud" aria-label="Field controls">
    <div class="hud-head">

          <input id="cf-email" name="email" type="email" autocomplete="email" required maxlength="200" />
        </div>

          <label for="cf-message">Message <span class="req" aria-hidden="true">*</span></label>
          <textarea id="cf-message" name="message" required maxlength="5000"></textarea>

          <input id="cf-honey" name="_honey" type="text" tabindex="-1" autocomplete="off" />

    </div>
  </div>
  <footer class="site-copy" aria-label="Copyright">© 2026 Andrew’s Office, LLC. All rights reserved.</footer>
  <script>
(function () {
  "use strict";

  const canvas = document.getElementById("field");
  const ctx = canvas.getContext("2d", { alpha: false });

  const LON_CELLS = 72;
  const LAT_CELLS = 36;
  const DENSITY_MAP = [500, 1100, 1800, 2800, 4200];
  // trails 1..5 → fade alpha (higher trails = lower fade = longer persistence)
  const TRAIL_FADE = [0.18, 0.12, 0.075, 0.045, 0.025];
  // speed 1..5 multipliers
  const SPEED_MAP = [0.45, 0.7, 1.0, 1.4, 1.9];
  // zoom 1..5 scale multipliers around default
  const ZOOM_MAP = [0.72, 0.86, 1.0, 1.18, 1.4];
  const DEFAULT_LAMBDA = -20 * Math.PI / 180;
  const DEFAULT_PHI = -18 * Math.PI / 180;
  const DEFAULT_GAMMA = 0;
  let width = 0, height = 0, dpr = 1;
  let windU = null, windV = null; // lon/lat grids, row-major lat×lon
  let usingLive = false;
  let particles = [];
  let animId = 0;
  let time = 0;
  let lastTs = 0;
  let showVectors = false;
  let densityLevel = 3;
  let speedLevel = 3;
  let trailsLevel = 3;
  let zoomLevel = 3;
  let showGrid = true;
  let projectionMode = "orthographic";

  // rotation: λ (yaw), φ (pitch), γ (roll)
  let lambda = DEFAULT_LAMBDA;
  let phi = DEFAULT_PHI;
  let gamma = DEFAULT_GAMMA;

  let projection = null;
  let pathGen = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#05070d";
    ctx.fillRect(0, 0, width, height);
    rebuildProjection();
    rebuildParticles();
  }

  function zoomMul() {
    return ZOOM_MAP[Math.max(0, Math.min(4, zoomLevel - 1))];
  }

  function rebuildProjection() {
    const z = zoomMul();
    const scale = projectionMode === "orthographic"
      ? Math.min(width, height) * 0.42 * z
      : Math.min(width / (2 * Math.PI), height / Math.PI) * 0.92 * z;
    if (projectionMode === "orthographic") {
      projection = d3.geoOrthographic()
        .scale(scale)
        .translate([width / 2, height / 2])
        .clipAngle(90)
        .rotate([lambda * 180 / Math.PI, phi * 180 / Math.PI, gamma * 180 / Math.PI]);
    } else {
      projection = d3.geoEquirectangular()
        .scale(scale)
        .translate([width / 2, height / 2])
        .rotate([lambda * 180 / Math.PI, phi * 180 / Math.PI, 0]);
    }
    pathGen = d3.geoPath(projection, ctx);
  }

  function idx(ilon, ilat) {
    ilon = ((ilon % LON_CELLS) + LON_CELLS) % LON_CELLS;
    ilat = Math.max(0, Math.min(LAT_CELLS - 1, ilat));
    return ilat * LON_CELLS + ilon;
  }

  function lonLatToCell(lon, lat) {
    const gx = ((lon + 180) / 360) * LON_CELLS;
    const gy = ((90 - lat) / 180) * LAT_CELLS;
    return { gx, gy };
  }

  function sampleWind(lon, lat) {
    if (!windU) return { u: 0, v: 0, mag: 0 };
    const { gx, gy } = lonLatToCell(lon, lat);
    const x0 = Math.floor(gx), y0 = Math.floor(gy);
    const tx = gx - x0, ty = Math.max(0, Math.min(1, gy - y0));
    const i00 = idx(x0, y0), i10 = idx(x0 + 1, y0);
    const i01 = idx(x0, y0 + 1), i11 = idx(x0 + 1, y0 + 1);
    const u = windU[i00] * (1 - tx) * (1 - ty) + windU[i10] * tx * (1 - ty)
            + windU[i01] * (1 - tx) * ty + windU[i11] * tx * ty;
    const v = windV[i00] * (1 - tx) * (1 - ty) + windV[i10] * tx * (1 - ty)
            + windV[i01] * (1 - tx) * ty + windV[i11] * tx * ty;
    return { u, v, mag: Math.hypot(u, v) };
  }

  function normalizeGrids(uArr, vArr) {
    let max = 1e-6;
    for (let i = 0; i < uArr.length; i++) max = Math.max(max, Math.hypot(uArr[i], vArr[i]));
    for (let i = 0; i < uArr.length; i++) {
      uArr[i] /= max;
      vArr[i] /= max;
    }
  }

  function syntheticField(t) {
    const uArr = new Float32Array(LON_CELLS * LAT_CELLS);
    const vArr = new Float32Array(LON_CELLS * LAT_CELLS);
    for (let j = 0; j < LAT_CELLS; j++) {
      for (let i = 0; i < LON_CELLS; i++) {
        const lon = -180 + (i / LON_CELLS) * 360;
        const lat = 90 - ((j + 0.5) / LAT_CELLS) * 180;
        const lonR = lon * Math.PI / 180;
        const latR = lat * Math.PI / 180;
        // neat forward zonal jet + mild meridional undulation
        const jet = 0.55 + 0.35 * Math.cos(latR * 2.2);
        const wave = Math.sin(lonR * 3 + t * 0.15) * Math.cos(latR) * 0.22;
        const u = jet + Math.sin(lonR * 2 - t * 0.1) * 0.08 * Math.cos(latR);
        const v = wave + Math.sin(latR * 3 + t * 0.12) * 0.12;
        const k = j * LON_CELLS + i;
        uArr[k] = u;
        vArr[k] = v;
      }
    }
    normalizeGrids(uArr, vArr);
    windU = uArr;
    windV = vArr;
  }

  async function fetchOpenMeteo() {
    const lats = d3.range(-60, 61, 15);
    const lons = d3.range(-165, 166, 30);
    const url = "https://api.open-meteo.com/v1/forecast?" + new URLSearchParams({
      latitude: lats.join(","),
      longitude: lons.join(","),
      current: "wind_speed_10m,wind_direction_10m",
      wind_speed_unit: "ms"
    }).toString();
    const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const points = Array.isArray(data) ? data : [data];
    const samples = [];
    for (const p of points) {
      if (!p.current) continue;
      const spd = +p.current.wind_speed_10m || 0;
      const dir = ((+p.current.wind_direction_10m || 0) * Math.PI) / 180;
      // meteorological: from-direction → toward u(east), v(north)
      samples.push({
        lon: +p.longitude,
        lat: +p.latitude,
        u: -Math.sin(dir) * spd,
        v: -Math.cos(dir) * spd
      });
    }
    if (samples.length < 6) throw new Error("sparse");

    const uArr = new Float32Array(LON_CELLS * LAT_CELLS);
    const vArr = new Float32Array(LON_CELLS * LAT_CELLS);
    for (let j = 0; j < LAT_CELLS; j++) {
      for (let i = 0; i < LON_CELLS; i++) {
        const lon = -180 + (i / (LON_CELLS - 1)) * 360;
        const lat = 90 - (j / (LAT_CELLS - 1)) * 180;
        let wu = 0, wv = 0, wsum = 0;
        for (const s of samples) {
          const dlon = Math.min(Math.abs(s.lon - lon), 360 - Math.abs(s.lon - lon));
          const dlat = Math.abs(s.lat - lat);
          const w = 1 / (dlon * dlon + dlat * dlat + 2.5);
          wu += s.u * w;
          wv += s.v * w;
          wsum += w;
        }
        // bias toward neat eastward drift for visual continuity
        uArr[j * LON_CELLS + i] = wu / wsum + 2.2;
        vArr[j * LON_CELLS + i] = (wv / wsum) * 0.65;
      }
    }
    normalizeGrids(uArr, vArr);
    windU = uArr;
    windV = vArr;
  }

  function particleCount() {
    return DENSITY_MAP[Math.max(0, Math.min(4, densityLevel - 1))];
  }

  function spawnParticle() {
    return {
      lon: Math.random() * 360 - 180,
      lat: (Math.random() * 140 - 70),
      age: Math.random() * 80,
      life: 70 + Math.random() * 140
    };
  }

  function rebuildParticles() {
    const n = particleCount();
    particles = d3.range(n).map(spawnParticle);
  }

  const DEFAULT_HUE = 185;
  let fieldHue = DEFAULT_HUE;

  function colorFor(mag) {
    const t = 0.28 + Math.min(0.72, mag * 0.95);
    const sat = 62 + t * 22;
    const light = 24 + t * 36;
    return "hsl(" + fieldHue + ", " + sat + "%, " + light + "%)";
  }

  function updateHueSwatch() {
    const sw = document.getElementById("hue-swatch");
    if (sw) {
      sw.style.background = "hsl(" + fieldHue + ", 72%, 55%)";
      sw.style.boxShadow = "0 0 10px hsla(" + fieldHue + ", 80%, 55%, 0.35)";
    }
  }

  function drawGlobeOutline() {
    if (!showGrid) return;
    ctx.save();
    ctx.beginPath();
    if (projectionMode === "orthographic") {
      pathGen({ type: "Sphere" });
      ctx.strokeStyle = "rgba(94, 234, 212, 0.14)";
      ctx.lineWidth = 1;
      ctx.stroke();
      // faint graticule
      ctx.beginPath();
      pathGen(d3.geoGraticule().step([30, 30])());
      ctx.strokeStyle = "rgba(94, 234, 212, 0.05)";
      ctx.lineWidth = 0.6;
      ctx.stroke();
    } else {
      pathGen(d3.geoGraticule().step([30, 30])());
      ctx.strokeStyle = "rgba(94, 234, 212, 0.05)";
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawVectors() {
    if (!showVectors || !windU) return;
    const stepLon = 20;
    const stepLat = 15;
    ctx.save();
    ctx.lineWidth = 0.9;
    ctx.lineCap = "round";
    for (let lat = -60; lat <= 60; lat += stepLat) {
      for (let lon = -180; lon < 180; lon += stepLon) {
        const s = sampleWind(lon, lat);
        if (s.mag < 0.05) continue;
        const p0 = projection([lon, lat]);
        if (!p0) continue;
        // step along geographic velocity for arrow tip
        const dt = 4.5;
        const lon1 = lon + s.u * dt / Math.max(0.2, Math.cos(lat * Math.PI / 180));
        const lat1 = Math.max(-85, Math.min(85, lat + s.v * dt));
        const p1 = projection([((lon1 + 540) % 360) - 180, lat1]);
        if (!p1) continue;
        // clip check for ortho
        if (projectionMode === "orthographic") {
          const r = [lambda * 180 / Math.PI, phi * 180 / Math.PI, gamma * 180 / Math.PI];
          // simple: if either point far from center beyond scale, skip
          const cx = width / 2, cy = height / 2;
          const sc = projection.scale();
          if (Math.hypot(p0[0] - cx, p0[1] - cy) > sc * 0.98) continue;
        }
        ctx.strokeStyle = "hsla(" + fieldHue + ", 80%, 75%, " + (0.18 + Math.min(0.35, s.mag * 0.4)) + ")";
        ctx.beginPath();
        ctx.moveTo(p0[0], p0[1]);
        ctx.lineTo(p1[0], p1[1]);
        ctx.stroke();
        // arrow head
        const ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
        const ah = 3.2;
        ctx.beginPath();
        ctx.moveTo(p1[0], p1[1]);
        ctx.lineTo(p1[0] - ah * Math.cos(ang - 0.45), p1[1] - ah * Math.sin(ang - 0.45));
        ctx.moveTo(p1[0], p1[1]);
        ctx.lineTo(p1[0] - ah * Math.cos(ang + 0.45), p1[1] - ah * Math.sin(ang + 0.45));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function speedMul() {
    return SPEED_MAP[Math.max(0, Math.min(4, speedLevel - 1))];
  }

  function trailFade() {
    return TRAIL_FADE[Math.max(0, Math.min(4, trailsLevel - 1))];
  }

  function advect(p) {
    const s = sampleWind(p.lon, p.lat);
    // geographic advection; u=east, v=north (degrees-ish scaled)
    const cosLat = Math.max(0.15, Math.cos(p.lat * Math.PI / 180));
    const speed = (0.35 + s.mag * 0.9) * speedMul();
    p.lon += (s.u * speed) / cosLat;
    p.lat += s.v * speed * 0.85;
    if (p.lon > 180) p.lon -= 360;
    if (p.lon < -180) p.lon += 360;
    if (p.lat > 85 || p.lat < -85) {
      Object.assign(p, spawnParticle());
      return null;
    }
    p.age++;
    if (p.age > p.life) {
      Object.assign(p, spawnParticle());
      return null;
    }
    return s;
  }

  function frame(ts) {
    const dt = lastTs ? Math.min(48, ts - lastTs) : 16;
    lastTs = ts;
    time = ts * 0.001;

    if (!usingLive) syntheticField(time);

    ctx.fillStyle = "rgba(5, 7, 13, " + trailFade() + ")";
    ctx.fillRect(0, 0, width, height);

    drawGlobeOutline();
    drawVectors();

    ctx.lineWidth = 1.05;
    ctx.lineCap = "round";

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const prev = projection([p.lon, p.lat]);
      const s = advect(p);
      if (!s) continue;
      const next = projection([p.lon, p.lat]);
      if (!prev || !next) continue;
      if (projectionMode === "orthographic") {
        const cx = width / 2, cy = height / 2, sc = projection.scale();
        if (Math.hypot(prev[0] - cx, prev[1] - cy) > sc * 1.02) continue;
        if (Math.hypot(next[0] - cx, next[1] - cy) > sc * 1.02) continue;
      }
      // skip huge jumps from date-line wrap in equirect
      if (Math.hypot(next[0] - prev[0], next[1] - prev[1]) > 40) continue;

      ctx.strokeStyle = colorFor(s.mag);
      ctx.globalAlpha = 0.14 + Math.min(0.42, s.mag * 0.45);
      ctx.beginPath();
      ctx.moveTo(prev[0], prev[1]);
      ctx.lineTo(next[0], next[1]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    animId = requestAnimationFrame(frame);
  }

  // --- interaction: drag rotate ---
  const drag = d3.drag()
    .on("start", function (event) {
      canvas.__rot0 = [lambda, phi, gamma];
      canvas.__xy0 = [event.x, event.y];
    })
    .on("drag", function (event) {
      const dx = event.x - canvas.__xy0[0];
      const dy = event.y - canvas.__xy0[1];
      if (projectionMode === "orthographic") {
        // spin globe: horizontal → λ, vertical → φ
        lambda = canvas.__rot0[0] + dx * 0.005;
        phi = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, canvas.__rot0[1] - dy * 0.005));
      } else {
        // equirectangular: pan longitude (and mild latitude)
        lambda = canvas.__rot0[0] + dx * 0.004;
        phi = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, canvas.__rot0[1] - dy * 0.003));
      }
      rebuildProjection();
    });

  d3.select(canvas).call(drag);

  // HUD
  const densityEl = document.getElementById("density");
  const speedEl = document.getElementById("speed");
  const trailsEl = document.getElementById("trails");
  const zoomEl = document.getElementById("zoom");
  const vectorsEl = document.getElementById("vectors");
  const gridEl = document.getElementById("grid");
  const resetEl = document.getElementById("reset");
  const orthoBtn = document.getElementById("proj-ortho");
  const equiBtn = document.getElementById("proj-equi");
  const hueEl = document.getElementById("hue");

  densityEl.addEventListener("input", () => {
    densityLevel = +densityEl.value;
    rebuildParticles();
  });

  speedEl.addEventListener("input", () => {
    speedLevel = +speedEl.value;
  });

  trailsEl.addEventListener("input", () => {
    trailsLevel = +trailsEl.value;
  });

  zoomEl.addEventListener("input", () => {
    zoomLevel = +zoomEl.value;
    rebuildProjection();
  });

  vectorsEl.addEventListener("click", () => {
    showVectors = !showVectors;
    vectorsEl.classList.toggle("on", showVectors);
    vectorsEl.setAttribute("aria-pressed", showVectors ? "true" : "false");
  });

  gridEl.addEventListener("click", () => {
    showGrid = !showGrid;
    gridEl.classList.toggle("on", showGrid);
    gridEl.setAttribute("aria-pressed", showGrid ? "true" : "false");
  });

  resetEl.addEventListener("click", () => {
    lambda = DEFAULT_LAMBDA;
    phi = DEFAULT_PHI;
    gamma = DEFAULT_GAMMA;
    zoomLevel = 3;
    zoomEl.value = "3";
    fieldHue = DEFAULT_HUE;
    if (hueEl) {
      hueEl.value = String(DEFAULT_HUE);
      updateHueSwatch();
    }
    // clear trail buffer with full bg fill
    ctx.fillStyle = "#05070d";
    ctx.fillRect(0, 0, width, height);
    rebuildProjection();
  });

  function setProjection(mode) {
    projectionMode = mode;
    orthoBtn.classList.toggle("active", mode === "orthographic");
    equiBtn.classList.toggle("active", mode === "equirectangular");
    rebuildProjection();
  }
  const hudEl = document.getElementById("hud");
  const hudToggle = document.getElementById("hud-toggle");
  function setHudCollapsed(collapsed) {
    hudEl.classList.toggle("collapsed", collapsed);
    hudToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
    hudToggle.title = collapsed ? "Expand controls" : "Minimize controls";
    try { localStorage.setItem("aofab-hud-collapsed", collapsed ? "1" : "0"); } catch (e) {}
  }
  hudToggle.addEventListener("click", () => {
    setHudCollapsed(!hudEl.classList.contains("collapsed"));
  });
  try {

  <script>
(function () {

    function items() { return Array.prototype.slice.call(lMenu.querySelectorAll('[role="menuitem"]')); }
    function isOpen() { return lMenu.classList.contains("open"); }
    function openLinks(focusLast) {

      lBtn.setAttribute("aria-expanded", "true");
      var it = items();

    }

      lMenu.classList.remove("open");
      lBtn.setAttribute("aria-expanded", "false");
      if (returnFocus) lBtn.focus();
    }
    lBtn.addEventListener("click", function () { isOpen() ? closeLinks(false) : openLinks(false); });

      if (e.key === "ArrowDown") { e.preventDefault(); openLinks(false); }
      else if (e.key === "ArrowUp") { e.preventDefault(); openLinks(true); }
    });
    lMenu.addEventListener("keydown", function (e) {
      var it = items(), i = it.indexOf(document.activeElement);
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeLinks(true); }
      else if (e.key === "ArrowDown") { e.preventDefault(); it[(i + 1) % it.length].focus(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); it[(i - 1 + it.length) % it.length].focus(); }
      else if (e.key === "Home") { e.preventDefault(); it[0].focus(); }
      else if (e.key === "End") { e.preventDefault(); it[it.length - 1].focus(); }
      else if (e.key === "Tab") { closeLinks(false); }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && isOpen()) { closeLinks(true); }
    });
    document.addEventListener("pointerdown", function (e) {
      if (isOpen() && !lMenu.contains(e.target) && !lBtn.contains(e.target)) closeLinks(false);
    }, true);
    ["pointerdown", "wheel", "touchstart"].forEach(function (t) {
      lMenu.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: true });
    });
    openBtn.addEventListener("click", function () { closeLinks(false); });
  })();
})();
